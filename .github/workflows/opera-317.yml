name: Opera Android #317

# Reproduce OpenIPC/majestic-webui#317 (Live page loads without video in Opera
# for Android) on REAL arm64 Opera. The lab's x86_64 emulator can't run Opera
# (arm64-only; it crashes in libndk_translation). GitHub's macOS runners are
# Apple-silicon, so an arm64-v8a Android emulator runs natively and Opera needs
# no translation. This is the spike that proves Opera runs; the reproduction
# builds on it.

on:
  workflow_dispatch:
  push:
    branches: [opera-317-arm-ci]

jobs:
  opera:
    # arm64 LINUX runner: arm64-native, and KVM works here (macOS hosted runners
    # expose no HVF, so their emulator cannot accelerate). arm64 emulator + arm64
    # Opera = no libndk_translation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Host + KVM
        run: |
          uname -m
          ls -la /dev/kvm || echo "NO /dev/kvm"
          egrep -c '(vmx|svm|Features)' /proc/cpuinfo || true

      - name: Enable KVM for all users
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run arm64 Opera on an arm64 emulator (KVM)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          emulator-boot-timeout: 1200
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/opera-spike.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-spike
          path: |
            opera-launch.png
            logcat.txt
          if-no-files-found: warn
